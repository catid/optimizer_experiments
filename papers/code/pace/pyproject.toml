[project]
name = "pace-optimizer"
version = "0.1.0"
description = "PACE: an AdamW variant with an lr-scaled pullback toward an EMA of the iterates, for constant-learning-rate language-model training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kwok Chun Au" },
    { name = "Adam Block" },
]
keywords = ["optimizer", "adamw", "ema", "language-models", "deep-learning", "pytorch"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.4",
    "typing-extensions>=4.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2606.25086"
Repository = "https://github.com/leonou2010/pace-optimizer"

[project.optional-dependencies]
# Everything needed to run training and reproduce the paper figures.
# Everything needed to train and to expand the reproduction config map.
# (No plotting deps — the repo ships configs, not figures.)
experiments = [
    "transformers>=4.40",
    "datasets>=2.19",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "wandb>=0.16",
    "pyyaml>=6.0",
    "pytest>=7.0",
]

[project.scripts]
pace-train = "pace.helpers.train:main"
pace-figure = "pace_figures.reproduce:main"
pace-data = "pace.helpers.data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pace", "src/pace_figures"]

[tool.uv]
# Pinned dev/experiment versions live in uv.lock; see README for `uv sync`.
