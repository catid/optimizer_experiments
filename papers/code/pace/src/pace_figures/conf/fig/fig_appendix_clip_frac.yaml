id: fig_appendix_clip_frac
paper: "Fig 12"
desc: "SmolLM2-1.7B: coordinate-saturation fraction over training (eta x kappa x c)"
dataset: smoltalk

# Appendix Fig 12 plots the lambda-clip fraction over training for SmolLM2-1.7B
# (exp14 sweep): 2 rows (lr in {3e-4, 1e-3}) x 3 cols (kappa in {0.2,0.5,0.7}),
# c-gradient lines. Pure PACE sweep (no AdamW/EMA points drawn). Values from
# fig_appendix_clip_frac.py: LRS=[3e-4,1e-3], KAPPAS=[0.2,0.5,0.7],
# C_VALUES=[0.005,0.015,0.05,0.15,0.5], ema_update_freq=1, const schedule, seed 42.
sweep:
  model: smollm2_1.7b
  base: {method: PACE, optimizer: {name: pace, ema_update_freq: 1}, schedule: const, seed: 42}
  grid:
    optimizer.lr: [0.0003, 0.001]
    optimizer.ema_kappa: [0.2, 0.5, 0.7]
    optimizer.lambda_pullback: [0.005, 0.015, 0.05, 0.15, 0.5]
