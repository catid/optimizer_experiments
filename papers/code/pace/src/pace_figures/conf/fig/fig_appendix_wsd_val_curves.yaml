id: fig_appendix_wsd_val_curves
paper: "Fig 14"
desc: "SmolLM2-135M WSD val trajectories at lr in {2e-3, 3e-3, 5e-3}"
dataset: smoltalk

# Validation-loss trajectories for AdamW+WSD / EMA+WSD / PACE on SmolLM2-135M, one
# panel per lr in {2e-3, 3e-3, 5e-3}. Same matched cells as Fig 15 (PACE best
# constant-lr cell; EMA c=0 at matched kappa/uf under WSD; AdamW+WSD uf=1).
# 3 lrs x 3 methods = 9 runs.
#   lr     PACE(c, kappa, uf)     EMA(c=0, kappa, uf)+WSD     AdamW+WSD
#   2e-3   (1e-4, 0.7, 5)         (0.7, 5)                    uf=1
#   3e-3   (0.3,  0.3, 1)         (0.3, 1)                    uf=1
#   5e-3   (0.1,  0.3, 1)         (0.3, 1)                    uf=1
curves:
  # ---- AdamW + WSD ----
  - {model: smollm2_135m, method: AdamW, schedule: wsd, seed: 42, optimizer: {name: adamw, lr: 0.002, lambda_pullback: 0.0}}
  - {model: smollm2_135m, method: AdamW, schedule: wsd, seed: 42, optimizer: {name: adamw, lr: 0.003, lambda_pullback: 0.0}}
  - {model: smollm2_135m, method: AdamW, schedule: wsd, seed: 42, optimizer: {name: adamw, lr: 0.005, lambda_pullback: 0.0}}
  # ---- EMA + WSD (c=0, matched kappa/uf) ----
  - {model: smollm2_135m, method: EMA, schedule: wsd, seed: 42, optimizer: {name: ema, lr: 0.002, lambda_pullback: 0.0, ema_kappa: 0.7, ema_update_freq: 5}}
  - {model: smollm2_135m, method: EMA, schedule: wsd, seed: 42, optimizer: {name: ema, lr: 0.003, lambda_pullback: 0.0, ema_kappa: 0.3, ema_update_freq: 1}}
  - {model: smollm2_135m, method: EMA, schedule: wsd, seed: 42, optimizer: {name: ema, lr: 0.005, lambda_pullback: 0.0, ema_kappa: 0.3, ema_update_freq: 1}}
  # ---- PACE (best constant-lr cell per lr) ----
  - {model: smollm2_135m, method: PACE, schedule: const, seed: 42, optimizer: {name: pace, lr: 0.002, lambda_pullback: 0.0001, ema_kappa: 0.7, ema_update_freq: 5}}
  - {model: smollm2_135m, method: PACE, schedule: const, seed: 42, optimizer: {name: pace, lr: 0.003, lambda_pullback: 0.3,    ema_kappa: 0.3, ema_update_freq: 1}}
  - {model: smollm2_135m, method: PACE, schedule: const, seed: 42, optimizer: {name: pace, lr: 0.005, lambda_pullback: 0.1,    ema_kappa: 0.3, ema_update_freq: 1}}
