id: fig_appendix_tulu_qwen
paper: "Fig 10"
desc: "Qwen3-1.7B on Tulu-3: c x kappa sweep at lr in {3e-4, 5e-4}"
dataset: tulu3

# Exact exp27 run set (Qwen3-1.7B fine-tuned on allenai/tulu-3-sft-mixture,
